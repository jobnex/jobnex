[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "low-risk-resume-agent"
version = "0.1.0"
description = "Grounded LangGraph resume tailoring with evidence provenance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langsmith==0.11.2",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "pytest>=8.0.0", "jsonschema>=4,<5"]

[project.scripts]
low-risk-resume = "low_risk_agent.cli:main"
low-risk-resume-save = "low_risk_agent.save_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
low_risk_agent = ["*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
