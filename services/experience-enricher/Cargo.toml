[package]
name = "experience-enricher"
version = "0.1.0"
edition = "2021"

[dependencies]
postgres = { version = "0.19", features = ["with-uuid-1", "with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
regex = "1"
uuid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
